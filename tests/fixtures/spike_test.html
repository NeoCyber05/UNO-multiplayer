<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UNO Spike Test</title>
</head>
<body>
  <h1>UNO GTK3/WebKitGTK Spike Test</h1>
  <div id="status">Starting...</div>
  <script>
    const statusEl = document.getElementById('status');
    window.addEventListener('uno:message', (event) => {
      if (event.detail && event.detail.type === 'OK') {
        statusEl.textContent = 'Received OK, sending SPIKE_DONE...';
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.uno) {
          window.webkit.messageHandlers.uno.postMessage(JSON.stringify({
            v: 1,
            id: 999,
            type: 'SPIKE_DONE',
            payload: {}
          }));
        }
      }
    });

    function sendHello() {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.uno) {
        statusEl.textContent = 'Sending HELLO...';
        window.webkit.messageHandlers.uno.postMessage(JSON.stringify({
          v: 1,
          id: 1,
          type: 'HELLO',
          payload: {}
        }));
      } else {
        setTimeout(sendHello, 50);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', sendHello);
    } else {
      sendHello();
    }
  </script>
</body>
</html>
