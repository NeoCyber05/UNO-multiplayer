<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 470" width="1380" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Soft modern shadow -->
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,2 L8,5 L1,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,2 L8,5 L1,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,2 L8,5 L1,8 Z" fill="#10b981"/>
    </marker>

    <!-- UNO Card Component: 22x32 -->
    <g id="uno-card">
      <rect x="-11" y="-16" width="22" height="32" rx="3.5" stroke="#ffffff" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="5" ry="9" fill="#ffffff" opacity="0.9" transform="rotate(25)"/>
    </g>

    <!-- Player Avatar Component -->
    <g id="avatar">
      <circle cx="0" cy="-7" r="9"/>
      <path d="M-14,14 C-14,3 14,3 14,14 Z"/>
    </g>

    <!-- Table Graphic Component -->
    <g id="game-table">
      <ellipse cx="0" cy="0" rx="88" ry="46" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="76" ry="36" fill="#f1f5f9"/>
      <!-- Draw pile -->
      <rect x="5" y="-13" width="18" height="26" rx="2.5" fill="#1e293b" stroke="#ffffff" stroke-width="1"/>
      <text x="14" y="3" font-size="7" font-weight="800" fill="#cbd5e1" text-anchor="middle">UNO</text>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1380" height="470" rx="14" fill="#ffffff"/>

  <!-- ================= 1. LEFT: P1 PLAYS CARD ================= -->
  <g transform="translate(18, 15)">
    <!-- Stage Title -->
    <text x="165" y="35" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">1. P1 Đánh Lá 7 Đỏ</text>

    <!-- Table Area -->
    <g transform="translate(165, 195)">
      <!-- Table Base -->
      <use href="#game-table"/>

      <!-- Current Discard Pile (Yellow 5) -->
      <g transform="translate(-14, 0)">
        <use href="#uno-card" fill="#eab308"/>
        <text x="0" y="3.5" font-size="9" font-weight="900" fill="#ca8a04" text-anchor="middle">5</text>
      </g>

      <!-- Players -->
      <!-- P3 (Top) -->
      <g transform="translate(0, -68)" fill="#94a3b8">
        <use href="#avatar"/>
        <text x="0" y="26" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">P3 (5 lá)</text>
      </g>

      <!-- P4 (Right) -->
      <g transform="translate(110, 0)" fill="#94a3b8">
        <use href="#avatar"/>
        <text x="0" y="26" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">P4 (4 lá)</text>
      </g>

      <!-- P2 (Bottom) -->
      <g transform="translate(0, 68)" fill="#94a3b8">
        <use href="#avatar"/>
        <text x="0" y="26" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">P2 (7 lá)</text>
      </g>

      <!-- P1 (Left - Active Player) -->
      <g transform="translate(-110, 0)">
        <circle cx="0" cy="0" r="25" fill="#fee2e2" opacity="0.6"/>
        <g fill="#ef4444">
          <use href="#avatar"/>
        </g>
        <rect x="-24" y="18" width="48" height="18" rx="9" fill="#ef4444"/>
        <text x="0" y="31" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">P1 LƯỢT</text>
      </g>

      <!-- Action Card Played (Red 7 Moving towards table) -->
      <g transform="translate(-50, -26)" filter="url(#card-shadow)">
        <line x1="-20" y1="15" x2="2" y2="2" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>
        <use href="#uno-card" fill="#ef4444" transform="rotate(-12)"/>
        <text x="0" y="4" font-size="11" font-weight="900" fill="#dc2626" text-anchor="middle" transform="rotate(-12)">7</text>
      </g>
    </g>
  </g>

  <!-- ================= ARROW: P1 -> SERVER ================= -->
  <g transform="translate(345, 210)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <rect x="4" y="-28" width="72" height="22" rx="11" fill="#0f172a"/>
    <text x="40" y="-13" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">PLAY_CARD</text>
  </g>

  <!-- ================= 2. CENTER: SERVER ================= -->
  <g transform="translate(440, 45)" filter="url(#shadow)">
    <!-- Server Shell -->
    <rect width="300" height="315" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="300" height="40" rx="14" fill="#f8fafc"/>
    <path d="M0,30 L0,40 L300,40 L300,30 Z" fill="#f8fafc"/>
    <circle cx="20" cy="20" r="5" fill="#3b82f6"/>
    <text x="32" y="25" font-size="13" font-weight="700" fill="#0f172a">MÁY CHỦ (SERVER)</text>
    <rect x="220" y="10" width="66" height="20" rx="10" fill="#e2e8f0"/>
    <text x="253" y="23.5" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">C11 Core</text>

    <!-- Component 1: WebSocket -->
    <g transform="translate(18, 54)">
      <rect width="264" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="132" y="26" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="middle">WebSocket Gateway</text>
      <text x="132" y="44" font-size="10.5" fill="#64748b" text-anchor="middle">Nhận &amp; xác thực session P1</text>
    </g>

    <!-- Internal Connectors -->
    <g stroke="#94a3b8" stroke-width="1.5" fill="none">
      <line x1="110" y1="112" x2="110" y2="142" marker-end="url(#arr-gray)"/>
      <line x1="190" y1="142" x2="190" y2="112" marker-end="url(#arr-gray)"/>
    </g>

    <!-- Component 2: Game Logic -->
    <g transform="translate(18, 144)">
      <rect width="264" height="150" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="132" y="25" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Game Engine (RAM)</text>
      
      <!-- Logic Step Badges -->
      <g transform="translate(14, 38)">
        <rect width="236" height="28" rx="6" fill="#ffffff" stroke="#dbeafe"/>
        <text x="10" y="18" font-size="10.5" font-weight="600" fill="#1e3a8a">1. Kiểm tra luật &amp; trừ lá bài</text>
      </g>
      <g transform="translate(14, 72)">
        <rect width="236" height="28" rx="6" fill="#ffffff" stroke="#dbeafe"/>
        <text x="10" y="18" font-size="10.5" font-weight="600" fill="#1e3a8a">2. Chuyển lượt sang P2 (Timer 20s)</text>
      </g>
      <g transform="translate(14, 106)">
        <rect width="236" height="28" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="10" y="18" font-size="10.5" font-weight="700" fill="#065f46">3. Fog of War: Tạo 4 snapshot</text>
      </g>
    </g>
  </g>

  <!-- SQLite Box below Server -->
  <g transform="translate(510, 390)">
    <line x1="80" y1="-28" x2="80" y2="-5" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-gray)"/>
    <rect width="160" height="42" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="80" y="20" font-size="11.5" font-weight="800" fill="#92400e" text-anchor="middle">SQLite Database</text>
    <text x="80" y="34" font-size="9" fill="#b45309" text-anchor="middle">Lưu ELO khi hết ván (Async)</text>
  </g>

  <!-- ================= ARROW: SERVER -> CLIENTS ================= -->
  <g transform="translate(740, 115)">
    <path d="M0,65 L28,65 L28,0 L60,0" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
    <path d="M28,65 L60,48" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M28,65 L60,98" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M28,65 L28,148 L60,148" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  </g>

  <!-- ================= 3. RIGHT: BROADCAST & UPDATED TABLE ================= -->
  <g transform="translate(805, 15)">
    <!-- Stage Title -->
    <text x="270" y="35" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">3. Mỗi Client Nhận Góc Nhìn Riêng</text>

    <!-- 4 Filtered State Pills -->
    <!-- P2 (Turn next) -->
    <g transform="translate(0, 100)">
      <rect width="205" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="6" y="6" width="32" height="22" rx="4" fill="#10b981"/>
      <text x="22" y="20" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">P2</text>
      <text x="44" y="16" font-size="10" font-weight="700" fill="#065f46">Lượt kế: Thấy bài P2</text>
      <text x="44" y="28" font-size="9" fill="#047857">P1: còn 6 lá (ẩn số)</text>
    </g>

    <!-- P1 (Just played) -->
    <g transform="translate(0, 148)">
      <rect width="205" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="6" y="5" width="32" height="22" rx="4" fill="#64748b"/>
      <text x="22" y="19" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">P1</text>
      <text x="44" y="16" font-size="10" font-weight="600" fill="#334155">Thấy bài P1 (đã trừ 7)</text>
      <text x="44" y="27" font-size="9" fill="#64748b">Lượt: Sang P2</text>
    </g>

    <!-- P3 -->
    <g transform="translate(0, 198)">
      <rect width="205" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="6" y="5" width="32" height="22" rx="4" fill="#64748b"/>
      <text x="22" y="19" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">P3</text>
      <text x="44" y="16" font-size="10" font-weight="600" fill="#334155">Thấy bài P3 riêng biệt</text>
      <text x="44" y="27" font-size="9" fill="#64748b">Chỉ thấy P1 giảm 1 lá</text>
    </g>

    <!-- P4 -->
    <g transform="translate(0, 248)">
      <rect width="205" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="6" y="5" width="32" height="22" rx="4" fill="#64748b"/>
      <text x="22" y="19" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">P4</text>
      <text x="44" y="16" font-size="10" font-weight="600" fill="#334155">Thấy bài P4 riêng biệt</text>
      <text x="44" y="27" font-size="9" fill="#64748b">Chỉ thấy P1 giảm 1 lá</text>
    </g>

    <!-- Updated Table Graphic -->
    <g transform="translate(390, 195)">
      <!-- Table Base -->
      <use href="#game-table"/>

      <!-- NEW Discard Pile (Red 7 is on top) -->
      <g transform="translate(-14, 0)">
        <use href="#uno-card" fill="#ef4444"/>
        <text x="0" y="4" font-size="11" font-weight="900" fill="#dc2626" text-anchor="middle">7</text>
      </g>

      <!-- Players -->
      <!-- P3 (Top) -->
      <g transform="translate(0, -68)" fill="#94a3b8">
        <use href="#avatar"/>
        <text x="0" y="26" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">P3 (5 lá)</text>
      </g>

      <!-- P4 (Right) -->
      <g transform="translate(110, 0)" fill="#94a3b8">
        <use href="#avatar"/>
        <text x="0" y="26" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">P4 (4 lá)</text>
      </g>

      <!-- P1 (Left - Finished Turn) -->
      <g transform="translate(-110, 0)" fill="#94a3b8">
        <use href="#avatar"/>
        <text x="0" y="26" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">P1 (còn 6 lá)</text>
      </g>

      <!-- P2 (Bottom - NEW ACTIVE TURN) -->
      <g transform="translate(0, 68)">
        <circle cx="0" cy="0" r="25" fill="#dcfce7" opacity="0.8"/>
        <g fill="#10b981">
          <use href="#avatar"/>
        </g>
        <rect x="-30" y="18" width="60" height="18" rx="9" fill="#10b981"/>
        <text x="0" y="31" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">P2 LƯỢT KẾ</text>
      </g>
    </g>
  </g>
</svg>
